[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Minimal LangGraph orchestration for DataAnalystAgent: data_cleaning_agent then EDAWorkflow"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "data-cleaning-agent",
    "eda-workflow",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "pandas>=2.3.0,<2.4",
    "python-dotenv>=1.0.0",
]

[[project.authors]]
name = "Andres Vourakis"

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=8.0.0",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
override-dependencies = [
    "pandas>=2.3.0,<2.4",
]

[tool.uv.sources]
data-cleaning-agent = { path = "../data-cleaning-agent", editable = true }
eda-workflow = { path = "../eda-workflow", editable = true }

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
